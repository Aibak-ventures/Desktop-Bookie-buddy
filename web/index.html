<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rental business management app.">
  <meta name="viewport" content="width=1280, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="bookie_buddy_web">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any">

  <title>Bookie buddy - Business management software</title>
  <link rel="manifest" href="manifest.json">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(function (registration) {
        // Periodic update check — browsers throttle this, so we nudge it every hour
        setInterval(function () { registration.update(); }, 60 * 60 * 1000);

        registration.addEventListener('updatefound', function () {
          var newWorker = registration.installing;
          newWorker.addEventListener('statechange', function () {
            // 'installed' + existing controller = new version waiting, not first install
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              window.dispatchEvent(new CustomEvent('bookiebuddy-update'));
            }
          });
        });
      });
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-width: 1280px;
      min-height: 720px;
      overflow-x: auto;
      overflow-y: auto;
    }

    body {
      margin: 0;
      padding: 0;
      min-width: 1280px;
      min-height: 720px;
      overflow: auto;
      width: 100%;
      height: 100%;
    }

    /* Flutter container with fixed minimum size */
    #root,
    flt-glass-pane {
      min-width: 1280px;
      min-height: 720px;
      width: 100%;
      height: 100%;
    }

    /* Loading indicator */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      min-height: 720px;
      background-color: #f5f5f5;
    }

    .loading::after {
      content: "Loading Bookie Buddy...";
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      color: #6b46c1;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }
  </style>
</head>

<body>
  <div class="loading"></div>

  <!--
    QZ Tray browser client — self-hosted (not loaded from a CDN) so printing
    doesn't break because a third-party host is unreachable. Pinned to
    match the QZ Tray desktop version (2.2.6+) shops are told to install;
    see thermal-printer-implementation-plan.md.

    jsrsasign + qz-sign-message.js sign every QZ Tray request (self-signed
    cert generated for this app — see qz-sign-message.js's doc comment for
    why the key ships client-side here) so QZ Tray's "Allow this site to
    print?" popup doesn't fire on every connect/find/print call. Must load
    in this order: qz-tray.js first (defines `qz`), then jsrsasign (defines
    KEYUTIL/KJUR), then qz-sign-message.js (uses both).
  -->
  <script src="qz/qz-tray.js"></script>
  <script src="qz/jsrsasign-all-min.js"></script>
  <script src="qz/qz-sign-message.js"></script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
