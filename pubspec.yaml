name: bookie_buddy_web
description: "Bookie buddy - Business management software"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.

version: 0.1.0+01
environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared with the mobile app (booking_application) — see
  # docs/shared-packages-plan.md in that repo and, in bookie-buddy-shared,
  # docs/SHARED_PACKAGE_DEV_GUIDE.md. Git ref-pinned to a tag (formerly two
  # packages, bookie_buddy_core + bookie_buddy_ui, which needed a raw
  # commit SHA here instead of a tag — see that repo's CHANGELOG.md for
  # why; merging into one package removed that constraint). For active
  # cross-repo dev, override locally in pubspec_overrides.yaml instead of
  # editing this block, e.g.:
  #
  #   dependency_overrides:
  #     bookie_buddy_shared:
  #       path: ../bookie-buddy-shared
  #
  # (path is relative to this repo's root; remove the override before
  # merging — pubspec_overrides.yaml is gitignored so it won't accidentally
  # get committed, but don't rely on that).
  bookie_buddy_shared:
    git:
      url: https://github.com/Aibak-ventures/bookie-buddy-shared.git
      ref: v2.0.0 # tag name


  image_picker: ^1.1.2
  image: ^4.3.0
  flutter_image_compress: ^2.3.0
  intl: any
  lottie: ^3.1.3
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  flutter_spinkit: ^5.2.1
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  connectivity_plus: ^7.3.2
  cached_network_image: ^4.0.5
  image_cropper: ^13.0.0
  shimmer: ^4.0.0
  dio: ^5.8.0+1
  logger: ^2.5.0
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  freezed_annotation: ^3.1.0
  bloc_concurrency: ^0.3.0
  json_annotation: ^4.12.0
  flutter_svg: ^2.1.0
  flutter_screenutil: ^5.9.3
  skeletonizer: ^3.0.0
  lucide_icons_flutter: ^4.0.1
  permission_handler: ^13.0.2
  flutter_typeahead: ^6.0.0
  characters: ^1.4.0
  stream_transform: ^2.1.1
  go_router: ^18.1.1
  file_picker: ^13.2.0
  open_file: ^4.0.0
  feedback: ^3.1.0
  vector_graphics: ^1.1.7
  phone_form_field: ^12.0.1

  # Standalone Material / Cupertino (replace package:flutter/material.dart & cupertino.dart)
  material_ui: ^1.8.0
  cupertino_ui: ^1.1.4
  cupertino_icons: ^2.0.0
  web: ^1.1.1

  # Thermal receipt printing (QZ Tray bridge)
  esc_pos_utils_plus: ^2.0.4
  printing: ^5.14.3

  collection: ^1.19.1
  bloc: ^9.2.1
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.3
  freezed: ^4.0.3
  build_runner: ^2.11.0
  json_serializable: ^6.14.0


# App icon configuration
flutter_launcher_icons:
  image_path: "assets/images/app_icon_light.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_light.png"

  windows:
    generate: true
    image_path: "assets/images/app_icon_light.png"

  macos:
    generate: true
    image_path: "assets/images/app_icon_light.png"

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
        - asset: assets/fonts/Inter_Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_SemiBold.ttf
          weight: 700
        - asset: assets/fonts/Inter_ExtraBold.ttf
          weight: 900

    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam.ttf
